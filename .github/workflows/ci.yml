name: Build e teste de boot
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  layos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Pipeline completo
        run: bash tools/ci/all.sh
      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layos
          path: |
            out/bzImage
            out/kernel.config
            out/initramfs.cpio.gz
            out/*.log
