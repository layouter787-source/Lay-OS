name: Lay OS build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm binutils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Lay OS image
        run: make
