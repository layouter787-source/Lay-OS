name: Lay OS build

on:
  push:
    branches: [main, progress-90]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm binutils qemu-system-x86

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Lay OS image
        run: make

      - name: Create persistent data disk
        run: truncate -s 2M build/data.img

      - name: Boot, write and reload persistent filesystem
        run: |
          set +e
          timeout 15s qemu-system-x86_64 -accel tcg -drive format=raw,file=build/lay-os.img -drive format=raw,file=build/data.img,if=ide,index=1 -display none -monitor none -serial none -debugcon file:build/debug-first.log -no-reboot -no-shutdown
          test -f build/debug-first.log
          grep -F "LAY OS KERNEL ONLINE" build/debug-first.log
          grep -F "selftest: persistent LayFS initialized" build/debug-first.log
          grep -F "process: pid 1 exited status 0" build/debug-first.log

          timeout 15s qemu-system-x86_64 -accel tcg -drive format=raw,file=build/lay-os.img -drive format=raw,file=build/data.img,if=ide,index=1 -display none -monitor none -serial none -debugcon file:build/debug-second.log -no-reboot -no-shutdown
          test -f build/debug-second.log
          grep -F "LAY OS KERNEL ONLINE" build/debug-second.log
          grep -F "selftest: persistent LayFS reload ok" build/debug-second.log
          grep -F "process: pid 1 exited status 0" build/debug-second.log

      - name: Upload image and boot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lay-os-build
          path: |
            build/lay-os.img
            build/debug-first.log
            build/debug-second.log
            build/data.img
