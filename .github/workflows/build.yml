name: Lay OS build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm binutils qemu-system-x86

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Lay OS image
        run: make

      - name: Boot smoke test
        run: |
          set +e
          timeout 6s qemu-system-x86_64             -accel tcg             -drive format=raw,file=build/lay-os.img             -display none             -monitor none             -serial none             -debugcon file:build/debug.log             -no-reboot             -no-shutdown
          test -f build/debug.log
          grep -F "LAY OS KERNEL ONLINE" build/debug.log

      - name: Upload image and boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lay-os-build
          path: |
            build/lay-os.img
            build/debug.log
